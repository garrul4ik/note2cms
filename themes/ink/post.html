<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — {{ site_title }}</title>
    <meta name="description" content="{{ excerpt }}">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ excerpt }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ site_url }}/posts/{{ slug }}/">
    <link rel="canonical" href="{{ site_url }}/posts/{{ slug }}/">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap');

        :root {
            --ink: #1a1714;
            --paper: #f5f0e8;
            --wash: #e8e0d0;
            --vermillion: #cc3333;
            --stone: #6b5f52;
            --faded: #9a8f80;
            --max-width: 40rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ink: #e0d8cc;
                --paper: #171412;
                --wash: #221e1a;
                --vermillion: #e04040;
                --stone: #9a8e80;
                --faded: #5a5248;
            }
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 18px; }

        body {
            font-family: 'Cormorant Garamond', 'Noto Sans JP', Georgia, serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.8;
            min-height: 100vh;
        }

        /* Subtle paper texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .post-wrapper {
            position: relative;
            z-index: 1;
        }

        /* --- Header --- */
        .post-header {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 6rem 1.5rem 3rem;
            text-align: center;
        }

        .post-meta {
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--stone);
            margin-bottom: 2rem;
        }

        .post-meta .sep {
            margin: 0 0.8rem;
            color: var(--faded);
        }

        .post-title {
            font-size: 2.6rem;
            font-weight: 400;
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        /* The trick: ink brushstroke under title */
        .post-title::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 10%;
            width: 80%;
            height: 3px;
            background: var(--vermillion);
            transform: scaleX(0);
            transform-origin: left;
            animation: brushstroke 1.2s ease-out 0.5s forwards;
        }

        @keyframes brushstroke {
            0% { transform: scaleX(0); opacity: 0.3; }
            60% { transform: scaleX(1.05); opacity: 1; }
            100% { transform: scaleX(1); opacity: 0.8; }
        }

        .post-tags {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .post-tags span {
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--stone);
            padding: 0.15rem 0.5rem;
            border: 1px solid var(--faded);
        }

        /* --- Content --- */
        .post-content {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        .post-content p {
            margin-bottom: 1.6rem;
            font-weight: 400;
            font-size: 1.05rem;
        }

        .post-content h2 {
            font-size: 1.6rem;
            font-weight: 400;
            margin: 3.5rem 0 1rem;
            padding-bottom: 0.4rem;
            position: relative;
        }

        /* Brushstroke under h2 — appears on scroll */
        .post-content h2::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 3rem;
            height: 2px;
            background: var(--vermillion);
            opacity: 0.7;
            transition: width 0.6s ease;
        }

        .post-content h2:hover::after {
            width: 100%;
        }

        .post-content h3 {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 2.5rem 0 0.8rem;
            color: var(--ink);
        }

        .post-content h4 {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--stone);
            margin: 2rem 0 0.6rem;
        }

        .post-content a {
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1px solid var(--vermillion);
            transition: border-width 0.2s;
        }

        .post-content a:hover {
            border-bottom-width: 2px;
        }

        /* The trick: blockquotes get a vermillion chop mark */
        .post-content blockquote {
            border: none;
            padding: 1.5rem 2rem 1.5rem 2.5rem;
            margin: 2.5rem 0;
            font-style: italic;
            font-weight: 400;
            color: var(--stone);
            position: relative;
            background: transparent;
        }

        .post-content blockquote::before {
            content: "";
            position: absolute;
            top: 0.8rem;
            left: 0;
            width: 4px;
            height: calc(100% - 1.6rem);
            background: var(--vermillion);
            opacity: 0.5;
        }

        /* Red chop mark (hanko) */
        .post-content blockquote::after {
            content: "◆";
            position: absolute;
            bottom: -0.5rem;
            right: 0.5rem;
            font-size: 0.9rem;
            color: var(--vermillion);
            opacity: 0.4;
            font-style: normal;
        }

        .post-content blockquote p {
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .post-content blockquote p:last-child {
            margin-bottom: 0;
        }

        .post-content ul, .post-content ol {
            padding-left: 1.5rem;
            margin-bottom: 1.6rem;
        }

        .post-content li {
            margin-bottom: 0.4rem;
            font-weight: 400;
        }

        .post-content li::marker {
            color: var(--vermillion);
        }

        .post-content code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.82rem;
            background: var(--wash);
            padding: 2px 5px;
            border-radius: 2px;
        }

        .post-content pre {
            background: var(--ink);
            color: var(--paper);
            padding: 1.5rem;
            margin: 2rem 0;
            overflow-x: auto;
            border-radius: 2px;
        }

        .post-content pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: 0.8rem;
            line-height: 1.7;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            margin: 2rem 0;
        }

        .post-content hr {
            border: none;
            text-align: center;
            margin: 3rem 0;
        }

        .post-content hr::after {
            content: "◇ ◇ ◇";
            color: var(--faded);
            font-size: 0.7rem;
            letter-spacing: 0.5rem;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 0.9rem;
        }

        .post-content th, .post-content td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--wash);
            text-align: left;
        }

        .post-content th {
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--stone);
        }

        /* --- Footer --- */
        .post-footer {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2.5rem 1.5rem 6rem;
            border-top: 1px solid var(--wash);
            text-align: center;
        }

        .post-footer a {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--stone);
            text-decoration: none;
            transition: color 0.2s;
        }

        .post-footer a:hover {
            color: var(--vermillion);
        }

        @media (max-width: 640px) {
            html { font-size: 16px; }
            .post-header { padding: 4rem 1.2rem 2rem; }
            .post-title { font-size: 2rem; }
            .post-content { padding: 0 1.2rem 4rem; }
        }
    </style>
</head>
<body>
    <div class="post-wrapper">
        <article>
            <header class="post-header">
                <div class="post-meta">
                    <time datetime="{{ date_iso }}">{{ date }}</time>
                    <span class="sep">·</span>
                    <span>{{ reading_time }} min read</span>
                </div>
                <h1 class="post-title">{{ title }}</h1>
                {% if tags %}
                <div class="post-tags">
                    {% for tag in tags %}
                    <span>{{ tag }}</span>
                    {% endfor %}
                </div>
                {% endif %}
            </header>

            <div class="post-content">
                {{ content }}
            </div>
        </article>

        <footer class="post-footer">
            <a href="{{ site_url }}/posts/">← All posts</a>
        </footer>
    </div>
</body>
</html>
