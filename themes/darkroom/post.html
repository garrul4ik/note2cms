<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — {{ site_title }}</title>
    <meta name="description" content="{{ excerpt }}">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ excerpt }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ site_url }}/posts/{{ slug }}/">
    <link rel="canonical" href="{{ site_url }}/posts/{{ slug }}/">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,300;1,8..60,400&family=DM+Mono:wght@400;500&display=swap');

        :root {
            --bg: #111111;
            --surface: #1a1a1a;
            --amber: #d4943a;
            --amber-dim: #a07030;
            --amber-glow: rgba(212, 148, 58, 0.08);
            --red-safe: #661a1a;
            --text: #c8c0b4;
            --text-dim: #706860;
            --border: #2a2520;
            --max-width: 42rem;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 17px; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            min-height: 100vh;
        }

        /* Subtle vignette */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        .post-wrapper { position: relative; z-index: 1; }

        /* Amber safelight bar */
        .safelight {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--amber) 20%, var(--amber) 80%, transparent 100%);
            opacity: 0.6;
        }

        /* --- Header --- */
        .post-header {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 5rem 1.5rem 2.5rem;
        }

        .post-meta {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-bottom: 1.2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .post-meta .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--amber);
            opacity: 0.6;
        }

        .post-title {
            font-size: 2.4rem;
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: -0.01em;
            color: var(--amber);
            margin-bottom: 1.5rem;
        }

        .post-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .post-tags span {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
            padding: 0.2rem 0.5rem;
            border: 1px solid var(--border);
        }

        /* --- Content --- */
        .post-content {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        .post-content p {
            margin-bottom: 1.5rem;
            font-weight: 300;
        }

        .post-content h2 {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--amber);
            margin: 3rem 0 1rem;
            position: relative;
            padding-left: 1rem;
        }

        /* The trick: amber line beside h2 that glows on hover */
        .post-content h2::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.2rem;
            width: 3px;
            height: 1em;
            background: var(--amber);
            opacity: 0.4;
            transition: opacity 0.4s, height 0.4s, box-shadow 0.4s;
        }

        .post-content h2:hover::before {
            opacity: 1;
            height: 100%;
            box-shadow: 0 0 12px var(--amber-glow), 0 0 4px var(--amber-dim);
        }

        .post-content h3 {
            font-size: 1.15rem;
            font-weight: 500;
            margin: 2.5rem 0 0.8rem;
            color: var(--text);
        }

        .post-content h4 {
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 2rem 0 0.6rem;
            color: var(--text-dim);
        }

        .post-content a {
            color: var(--amber);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
            transition: border-color 0.3s;
        }

        .post-content a:hover {
            border-color: var(--amber);
        }

        /* Blockquotes: red safelight tint */
        .post-content blockquote {
            border-left: 2px solid var(--amber-dim);
            padding: 0.8rem 1.5rem;
            margin: 2rem 0;
            background: rgba(102, 26, 26, 0.08);
            font-style: italic;
            color: var(--text-dim);
        }

        .post-content blockquote p { margin-bottom: 0.4rem; }
        .post-content blockquote p:last-child { margin-bottom: 0; }

        .post-content ul, .post-content ol {
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .post-content li {
            margin-bottom: 0.4rem;
            font-weight: 300;
        }

        .post-content li::marker { color: var(--amber-dim); }

        .post-content code {
            font-family: 'DM Mono', monospace;
            font-size: 0.84rem;
            background: var(--surface);
            padding: 2px 5px;
            border: 1px solid var(--border);
            color: var(--amber);
        }

        .post-content pre {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.2rem 1.5rem;
            margin: 2rem 0;
            overflow-x: auto;
        }

        .post-content pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--text);
            font-size: 0.82rem;
            line-height: 1.7;
        }

        /* The trick: images "develop" — start dark, fade in like a photo in developer fluid */
        .post-content img {
            max-width: 100%;
            height: auto;
            margin: 2rem 0;
            border: 1px solid var(--border);
            animation: develop 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes develop {
            0% { opacity: 0; filter: brightness(0.1) sepia(1) saturate(0.3); }
            40% { opacity: 0.6; filter: brightness(0.5) sepia(0.5) saturate(0.7); }
            100% { opacity: 1; filter: brightness(1) sepia(0) saturate(1); }
        }

        .post-content hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
            margin: 3rem 0;
            opacity: 0.4;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 0.88rem;
        }

        .post-content th {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-align: left;
            padding: 0.5rem 0.8rem;
            color: var(--amber-dim);
            border-bottom: 1px solid var(--border);
        }

        .post-content td {
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        /* --- Footer --- */
        .post-footer {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2rem 1.5rem 5rem;
            border-top: 1px solid var(--border);
        }

        .post-footer a {
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.3s;
        }

        .post-footer a:hover { color: var(--amber); }

        @media (max-width: 640px) {
            html { font-size: 15px; }
            .post-header { padding: 3.5rem 1.2rem 2rem; }
            .post-title { font-size: 1.9rem; }
            .post-content { padding: 0 1.2rem 3rem; }
        }
    </style>
</head>
<body>
    <div class="post-wrapper">
        <div class="safelight"></div>

        <article>
            <header class="post-header">
                <div class="post-meta">
                    <time datetime="{{ date_iso }}">{{ date }}</time>
                    <span class="dot"></span>
                    <span>{{ reading_time }} min read</span>
                </div>
                <h1 class="post-title">{{ title }}</h1>
                {% if tags %}
                <div class="post-tags">
                    {% for tag in tags %}
                    <span>{{ tag }}</span>
                    {% endfor %}
                </div>
                {% endif %}
            </header>

            <div class="post-content">
                {{ content }}
            </div>
        </article>

        <footer class="post-footer">
            <a href="{{ site_url }}/posts/">← all posts</a>
        </footer>
    </div>
</body>
</html>
